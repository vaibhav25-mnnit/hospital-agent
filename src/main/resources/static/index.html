<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hospital Agent Chat</title>
    <style>
        :root { --bg:#f4f5f7; --panel:#fff; --text:#1d1f23; --muted:#6b7280;
                --user:#2563eb; --bot:#e8eaee; --border:#d9dce1; --errbg:#fde8e8; --errtext:#8a1f1f; }
        @media (prefers-color-scheme: dark) {
          :root { --bg:#14161a; --panel:#1d2026; --text:#e6e8eb; --muted:#9aa1ac;
                  --user:#3b6fe0; --bot:#2a2e36; --border:#33373f; --errbg:#3a1f1f; --errtext:#f3b4b4; }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
               display:flex; justify-content:center; }
        .app { width:100%; max-width:760px; height:100%; display:flex; flex-direction:column;
               background:var(--panel); border-left:1px solid var(--border); border-right:1px solid var(--border); }
        header { padding:12px 16px; border-bottom:1px solid var(--border);
                 display:flex; justify-content:space-between; align-items:center; }
        header h1 { font-size:16px; margin:0; }
        button { font:inherit; cursor:pointer; color:var(--text); }
        .ghost { background:none; border:1px solid var(--border); border-radius:6px; padding:4px 10px; }
        #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
        .msg { max-width:82%; padding:10px 12px; border-radius:12px; white-space:pre-wrap;
               overflow-wrap:anywhere; line-height:1.45; }
        .user { align-self:flex-end; background:var(--user); color:#fff; }
        .bot  { align-self:flex-start; background:var(--bot); }
        .err  { align-self:flex-start; background:var(--errbg); color:var(--errtext); }
        .wait { align-self:flex-start; color:var(--muted); font-size:14px; }
        .meta { display:block; margin-top:6px; font-size:12px; color:var(--muted); }
        .chips { padding:0 16px 8px; display:flex; gap:6px; flex-wrap:wrap; }
        .chips button { background:none; border:1px solid var(--border); border-radius:14px;
                        padding:4px 10px; font-size:13px; }
        form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
        textarea { flex:1; resize:none; font:inherit; padding:8px 10px; border-radius:8px;
                   border:1px solid var(--border); background:var(--panel); color:var(--text); }
        #send { background:var(--user); color:#fff; border:none; border-radius:8px; padding:0 18px; }
        #send:disabled { opacity:.5; cursor:not-allowed; }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>Hospital Agent</h1>
        <button class="ghost" id="clear" type="button">Clear screen</button>
    </header>

    <div id="log"></div>

    <div class="chips" id="chips"></div>

    <form id="form">
        <textarea id="input" rows="2" placeholder="Ask something... (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send" type="submit">Send</button>
    </form>
</div>

<script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let busy = false;

    const samples = [
      'List all patients',
      'Is there a patient named vaibhav?',
      'Show reports of patient 2',
      'What is his phone number?'
    ];

    samples.forEach(q => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = q;
      b.onclick = () => send(q);
      document.getElementById('chips').appendChild(b);
    });

    function add(text, cls, meta) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;                 // textContent, never innerHTML: model output is untrusted
      if (meta) {
        const m = document.createElement('span');
        m.className = 'meta';
        m.textContent = meta;
        d.appendChild(m);
      }
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;
    }

    async function send(text) {
      text = text.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      add(text, 'user');
      input.value = '';

      const wait = add('Thinking... 0s', 'wait');
      const start = Date.now();
      const timer = setInterval(() => {
        wait.textContent = 'Thinking... ' + Math.round((Date.now() - start) / 1000) + 's';
      }, 1000);
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 180000);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
          signal: ctrl.signal
        });
        const raw = await res.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (e) { /* not JSON */ }
        const secs = ((Date.now() - start) / 1000).toFixed(1) + 's';

        if (!res.ok) {
          add('Error ' + res.status + ': ' + (data.error || data.message || raw.slice(0, 300)), 'err');
        } else {
          add(data.reply ?? raw, 'bot', secs);
        }
      } catch (e) {
        add(e.name === 'AbortError' ? 'Timed out after 180 seconds.' : 'Request failed: ' + e.message, 'err');
      } finally {
        clearTimeout(timeout);
        clearInterval(timer);
        wait.remove();
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      send(input.value);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(input.value);
      }
    });
    document.getElementById('clear').onclick = () => { log.innerHTML = ''; };
    input.focus();
</script>
</body>
</html>
